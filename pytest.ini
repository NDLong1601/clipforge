[pytest]
testpaths = tests
markers =
    reliability_r0: desired-behavior regressions for findings F1-F9; known reds use strict xfail
    reliability_r1: commit/staging/upload recovery fault and race regressions
    reliability_r2: native process ownership, shutdown and saved snapshot restart regressions
    reliability_r3: revision/config guards and validated computation cache dependencies
    reliability_r4: UI completion/discard contracts and durable upload follow-up deduplication
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning
